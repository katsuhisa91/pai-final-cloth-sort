# dora-rs のノード構成。ロボット側(sim)と AI 側(brain)を別プロセスに分け、記録(recorder)を横から挿す。
#   dora run dataflow.yml
nodes:
  - id: sim
    path: cloth_sort/nodes/sim_node.py
    env:
      BACKEND: "cloth"           # "cloth": 変形体の布 + 2 本指 / "mujoco": 剛体 + 吸着 / "2d": 自前の 2D
      ARM: "scripted"            # "scripted": 手続き的な把持 / "policy": 学習した方策(ACT。cloth のみ、.venv-il で実行)
      POLICY_PATH: "runs/train/act/checkpoints/020000/pretrained_model"   # ARM=policy のときに読む学習済みモデル
      SEED: "4"
      N_PIECES: "8"
      DT: "0.05"
      FRAME_DIR: "runs/dora/frames"
    inputs:
      tick:
        source: dora/timer/millis/50
        queue_size: 1000
      capture_request: brain/capture_request
      task: brain/task
      finish: brain/finish
    outputs: [image, background, result]

  - id: brain
    path: cloth_sort/nodes/brain_node.py
    env:
      MIN_CONFIDENCE: "0.6"
    inputs:
      tick:
        source: dora/timer/millis/500
        queue_size: 10
      background: sim/background
      image: sim/image
      result: sim/result
    outputs: [capture_request, task, finish, reading, record]

  - id: recorder
    path: cloth_sort/nodes/recorder_node.py
    env:
      RECORD_PATH: "runs/dora/log.jsonl"
    inputs:
      reading: brain/reading
      record: brain/record
